name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build (bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `bun run build` generates the icons and social thumbnails, which needs four
      # font files. They are pinned to commit shas, so this cache key never has to
      # change for correctness — it only saves the fetch. A cache miss costs one
      # download; a font CDN outage with a warm cache costs nothing.
      - name: Cache the generator's fonts
        uses: actions/cache@v4
        with:
          path: .fonts-cache
          key: fonts-${{ hashFiles('scripts/make-images.mjs') }}

      # Three steps behind one command: eleventy, then the image generator, then
      # eleventy again. Nothing here needs a system package — the generator renders
      # with satori and @resvg/resvg-js from package.json.
      - name: Build the site
        run: bun run build

      # There is no test suite. The build output is the proof.
      - name: Check the build output
        run: ./scripts/check-build.sh

      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: dist
          retention-days: 7

  devenv:
    name: Dev environment (devenv)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true

      - uses: cachix/cachix-action@v16
        with:
          name: devenv

      # This installs the latest devenv CLI. If the CLI becomes newer than
      # devenv.lock, the job fails with a lock error. Run `devenv update devenv`
      # to refresh the lock.
      - name: Install devenv
        run: nix profile install nixpkgs#devenv

      # This builds the shell, installs bun and the dependencies, then runs the
      # `build` script inside the shell.
      - name: Build the site inside the devenv shell
        run: devenv shell build

      - name: Check the build output
        run: test -f dist/index.html

  # This replaces the legacy Jekyll build of GitHub Pages. That build always
  # failed, because Jekyll reads the Nunjucks templates as Liquid.
  # Netlify keeps serving elliancarlos.com.br. Pages serves the same output at
  # https://elliancarlos.github.io/. The repository CNAME file stays out of
  # dist/, so Pages never claims the custom domain.
  deploy-pages:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Download the dist artifact from the build job
        uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@v4
